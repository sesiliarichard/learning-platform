<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Talent – Women in AI Talent Hub</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --blue:      #0077cc;
      --blue-mid:  #0099ff;
      --navy:      #0a1a4a;
      --page-bg:   #e8e8e8;
      --border:    #e0e4f0;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--page-bg);
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: rgba(255,255,255,0.97);
      -webkit-backdrop-filter: blur(10px);
       backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .logo { display:flex; align-items:center; height:44px; text-decoration:none; }
    .logo img { height:100%; object-fit:contain; }

    .nav-back {
      background: white;
      color: var(--blue-mid);
      border: 2px solid var(--blue-mid);
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
      font-family: 'Syne', sans-serif;
    }
    .nav-back:hover { background: var(--blue-mid); color: white; }

    /* ── PAGE HEADER ── */
    .page-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      padding: 48px 40px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content:''; position:absolute; top:-80px; right:-80px;
      width:300px; height:300px;
      background:rgba(255,255,255,0.05); border-radius:50%;
    }
    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem; font-weight: 800;
      color: white; margin-bottom: 6px;
      position: relative; z-index:1;
    }
    .page-header p {
      color: rgba(255,255,255,0.72);
      font-size: 14px; position: relative; z-index:1;
    }

    .search-bar {
      max-width: 600px; margin: 24px auto 0;
      display: flex; gap: 10px;
      position: relative; z-index:1;
    }
    .search-bar input {
      flex:1; padding:12px 18px;
      border:none; border-radius:10px;
      font-size:14px; font-family:inherit; outline:none;
    }
    .search-bar button {
      padding:12px 24px;
      background: var(--navy); color:white; border:none;
      border-radius:10px; font-family:'Syne',sans-serif;
      font-size:14px; font-weight:700; cursor:pointer;
      transition:opacity 0.2s;
    }
    .search-bar button:hover { opacity:0.85; }

    /* ── CONTENT ── */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .results-bar {
      display:flex; justify-content:space-between;
      align-items:center; margin-bottom:24px;
    }
    .results-count { font-size:14px; font-weight:600; color:#1a1a2e; }
    .sort-select {
      border:1.5px solid var(--border); border-radius:8px;
      padding:8px 12px; font-size:13px; font-family:inherit;
      background:white; cursor:pointer; outline:none;
    }

    /* ── TALENT GRID ── */
    .talent-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    /* ── CARD ── */
    .talent-card {
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s;
      animation: fadeUp 0.4s ease both;
    }
    .talent-card:hover { transform: translateY(-5px); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* dark / light alternating */
    .card-dark { background: #1a1a1a; }
    .card-light { background: #f0f0f0; }

    /* photo area */
    .card-photo {
      width:100%; aspect-ratio:4/3;
      overflow:hidden; display:flex;
      align-items:center; justify-content:center;
      flex-shrink:0;
    }
    .card-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .card-photo-initials {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-family:'Syne',sans-serif; font-size:36px; font-weight:800;
    }
    .card-dark .card-photo-initials { background:#2a2a2a; color:rgba(255,255,255,0.25); }
    .card-light .card-photo-initials { background:#d8d8d8; color:rgba(0,0,0,0.2); }

    /* info section */
    .card-info { padding:14px 14px 0; flex:1; }

    .card-nameline {
      display:flex; align-items:flex-start;
      justify-content:space-between; gap:6px;
    }
    .card-name {
      font-family:'Syne',sans-serif; font-size:14px;
      font-weight:800; line-height:1.2;
    }
    .card-dark .card-name { color:#ffffff; }
    .card-light .card-name { color:#111111; }

    .card-verified { color:#1d80e8; font-size:16px; flex-shrink:0; }

    .card-role { font-size:11px; font-weight:500; margin-top:2px; }
    .card-dark .card-role { color:rgba(255,255,255,0.5); }
    .card-light .card-role { color:#666666; }

    .card-loc {
      display:flex; align-items:center; gap:4px;
      font-size:11px; font-weight:600; margin-top:6px;
    }
    .card-dark .card-loc { color:rgba(255,255,255,0.85); }
    .card-light .card-loc { color:#222222; }

    .card-loc img { border-radius:2px; vertical-align:middle; }

    .card-bio { font-size:11px; line-height:1.5; margin-top:8px; }
    .card-dark .card-bio { color:rgba(255,255,255,0.45); }
    .card-light .card-bio { color:#777777; }

    /* stats pills */
    .card-stats {
      display:flex; gap:5px;
      margin:10px 14px; flex-wrap:wrap;
    }
    .stat-pill {
      display:flex; align-items:center; gap:4px;
      border-radius:99px; padding:4px 9px;
      font-size:11px; font-weight:600;
    }
    .card-dark .stat-pill {
      background:rgba(255,255,255,0.08);
      border:0.5px solid rgba(255,255,255,0.12);
      color:rgba(255,255,255,0.75);
    }
    .card-light .stat-pill {
      background:#e2e2e2; border:0.5px solid #cccccc; color:#333333;
    }
    .stat-pill svg { width:12px; height:12px; flex-shrink:0; }
    .card-dark  .stat-pill svg { stroke:rgba(255,255,255,0.5); }
    .card-light .stat-pill svg { stroke:#555555; }
    .stat-pill.star-pill { 
      
    }
    .star-icon { color:#e6a817; font-size:12px; }

    /* view profile button */
    .card-btn {
      margin:0 14px 14px;
      width:calc(100% - 28px);
      padding:11px 0;
      border-radius:12px;
      font-size:12px; font-weight:700;
      font-family:'Syne',sans-serif;
      cursor:pointer;
      transition:background 0.15s;
      display:flex; align-items:center;
      justify-content:center; gap:6px;
    }
    .card-dark .card-btn {
      background:#2c2c2c; border:0.5px solid rgba(255,255,255,0.12);
      color:#ffffff;
    }
    .card-dark .card-btn:hover { background:#383838; }
    .card-light .card-btn {
      background:#e0e0e0; border:0.5px solid #cccccc; color:#111111;
    }
    .card-light .card-btn:hover { background:#d0d0d0; }

    /* ── SKELETON ── */
    .skel-card {
      border-radius:22px; overflow:hidden;
      background:#e0e0e0;
    }
    .skel-photo {
      width:100%; aspect-ratio:4/3;
      background: linear-gradient(90deg,#d8d8d8 25%,#c8c8c8 50%,#d8d8d8 75%);
      background-size:200% 100%;
      animation:shimmer 1.4s infinite;
    }
    .skel-body { padding:14px; display:flex; flex-direction:column; gap:8px; }
    .skel-line {
      height:13px; border-radius:6px;
      background: linear-gradient(90deg,#d8d8d8 25%,#c8c8c8 50%,#d8d8d8 75%);
      background-size:200% 100%;
      animation:shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%  { background-position:200% 0; }
      100%{ background-position:-200% 0; }
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align:center; padding:80px 20px;
      color:#6b7280; grid-column:1/-1;
    }
    .empty-state .emoji { font-size:3rem; margin-bottom:12px; }
    .empty-state h3 {
      font-family:'Syne',sans-serif; font-size:18px;
      font-weight:700; color:#1a1a2e; margin-bottom:6px;
    }

    /* ── PAGINATION ── */
    .pagination {
      display:none; justify-content:center;
      align-items:center; gap:8px; margin-top:36px;
    }
    .page-btn {
      width:36px; height:36px;
      border:1.5px solid var(--border); border-radius:8px;
      background:white; font-size:13px; font-weight:600;
      cursor:pointer; display:flex; align-items:center;
      justify-content:center; transition:all 0.15s;
    }
    .page-btn:hover { border-color:var(--blue-mid); color:var(--blue-mid); }
    .page-btn:disabled { opacity:0.35; cursor:not-allowed; }
    .page-btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; }
    .page-info { font-size:13px; font-weight:600; }

    /* ── MODAL ── */
    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.55);
      z-index:1000; display:flex;
      align-items:center; justify-content:center;
      padding:20px;
    }
    .modal {
      background:white; border-radius:22px;
      max-width:520px; width:100%;
      max-height:90vh; overflow-y:auto;
      box-shadow:0 24px 60px rgba(0,0,0,0.3);
      animation:modalIn 0.22s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform:scale(0.96); }
      to   { opacity:1; transform:scale(1); }
    }

    /* modal header — dark like reference */
    .modal-header {
      background:#1a1a1a;
      border-radius:22px 22px 0 0;
      padding:28px 24px 24px;
      position:relative;
    }
    .modal-close-x {
      position:absolute; top:14px; right:16px;
      background:rgba(255,255,255,0.12); border:none;
      border-radius:50%; width:30px; height:30px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:rgba(255,255,255,0.8);
      font-size:16px; font-family:inherit;
      transition:background 0.15s;
    }
    .modal-close-x:hover { background:rgba(255,255,255,0.2); }

    .modal-avatar-wrap {
      width:80px; height:80px; border-radius:50%;
      border:3px solid rgba(255,255,255,0.2);
      margin:0 auto 14px; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      font-family:'Syne',sans-serif; font-size:1.8rem;
      font-weight:800; color:rgba(255,255,255,0.35);
      background:#2a2a2a;
    }
    .modal-avatar-wrap img { width:100%; height:100%; object-fit:cover; }

    .modal-name {
      font-family:'Syne',sans-serif; font-size:1.2rem;
      font-weight:800; color:#ffffff; text-align:center;
    }
    .modal-role-text { color:rgba(255,255,255,0.55); font-size:13px; text-align:center; margin-top:3px; }

    .modal-badges {
      display:flex; gap:6px; justify-content:center;
      flex-wrap:wrap; margin-top:12px;
    }
    .modal-badge {
      font-size:10px; font-weight:700;
      padding:4px 11px; border-radius:99px;
      background:rgba(255,255,255,0.1);
      color:rgba(255,255,255,0.85);
      font-family:'Syne',sans-serif;
      display:flex; align-items:center; gap:5px;
    }
    .modal-badge img { border-radius:2px; }

    /* modal body */
    .modal-body { padding:22px 24px; display:flex; flex-direction:column; gap:14px; }

    .modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    .modal-field {
      background:#f8faff; border-radius:10px; padding:12px 14px;
    }
    .modal-field-label {
      font-size:10px; font-weight:700; color:var(--blue-mid);
      text-transform:uppercase; letter-spacing:.06em;
      margin-bottom:4px; font-family:'Syne',sans-serif;
    }
    .modal-field-value { font-size:13px; color:#1a1a2e; line-height:1.6; }

    .modal-skills { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .modal-skill-tag {
      background:#e8f4ff; color:var(--blue);
      border:1px solid rgba(0,153,255,0.2);
      border-radius:6px; font-size:11px;
      font-weight:600; padding:3px 10px;
    }

    .modal-footer { display:flex; gap:10px; padding:0 24px 24px; }
    .modal-close-btn {
      flex:1; padding:12px 0;
      background:#f0f0f0; border:none; border-radius:12px;
      font-family:'Syne',sans-serif; font-size:13px;
      font-weight:700; cursor:pointer; color:#333;
      transition:background 0.15s;
    }
    .modal-close-btn:hover { background:#e0e0e0; }
    .modal-contact-btn {
      flex:1; padding:12px 0;
      background:#1a1a1a; border:none; border-radius:12px;
      font-family:'Syne',sans-serif; font-size:13px;
      font-weight:700; cursor:pointer; color:#ffffff;
      transition:background 0.15s;
    }
    .modal-contact-btn:hover { background:#333; }

    /* ── RESPONSIVE ── */
    @media (max-width:1024px) { .talent-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:768px) {
      .talent-grid { grid-template-columns:repeat(2,1fr); }
      .page-header { padding:32px 20px; }
      .page-header h1 { font-size:1.6rem; }
      .content { padding:24px 16px 48px; }
      nav { padding:0 16px; }
    }
    @media (max-width:480px) { .talent-grid { grid-template-columns:1fr 1fr; gap:12px; } }

    .sr-only {
      position:absolute; width:1px; height:1px;
      padding:0; margin:-1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="career-support.html">
    <img src="images/logo-non.png" alt="Women in AI Talent Hub"/>
  </a>
  <a href="career-support.html" class="nav-back">← Back to Home</a>
</nav>

<div class="page-header">
  <h1>Browse Talent</h1>
  <p>Discover skilled African women in AI — open to opportunities</p>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search by name, role, skill or country…"/>
    <button onclick="applySearch()">Search</button>
  </div>
</div>

<div class="content">
  <div class="results-bar">
    <span class="results-count" id="resultsCount">Loading…</span>
    <label for="sortSelect" class="sr-only">Sort talent</label>
    <select class="sort-select" id="sortSelect" onchange="applySearch()">
      <option value="recent">Most Recent</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>

  <div class="talent-grid" id="talentGrid"></div>

  <div class="pagination" id="pagination">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="pageInfo" class="page-info"></span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<div id="profileModal"></div>

<script>
  let currentPage = 1;
  const PAGE_SIZE = 8;
  let totalCount  = 0;

  const EXP_YRS = { beginner:'0–2 yrs', intermediate:'2–5 yrs', advanced:'5+ yrs' };
  const EXP_LABELS = { beginner:'Beginner (0–2 yrs)', intermediate:'Intermediate (2–5 yrs)', advanced:'Advanced (5+ yrs)' };

  function escHtml(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function countryFlag(code) {
    if (!code || code.length!==2) return '';
    return `<img src="https://flagcdn.com/16x12/${code.toLowerCase()}.png"
      width="16" height="12" style="border-radius:2px;vertical-align:middle;"
      onerror="this.style.display='none'"> `;
  }

  function skillCount(skills) {
    if (!skills) return 0;
    return skills.split(',').map(s=>s.trim()).filter(Boolean).length;
  }

  function showSkeletons() {
    document.getElementById('talentGrid').innerHTML = Array(8).fill(`
      <div class="skel-card">
        <div class="skel-photo"></div>
        <div class="skel-body">
          <div class="skel-line" style="width:70%"></div>
          <div class="skel-line" style="width:45%;height:11px"></div>
          <div class="skel-line" style="width:55%;height:11px"></div>
        </div>
      </div>`).join('');
  }

  async function loadTalent() {
    showSkeletons();
    document.getElementById('resultsCount').textContent = 'Loading…';

    const search = document.getElementById('searchInput').value.trim();
    const sort   = document.getElementById('sortSelect').value;
    const from   = (currentPage-1)*PAGE_SIZE;
    const to     = from+PAGE_SIZE-1;

    let query = window.supabaseClient
      .from('talent_profiles')
      .select('*', { count:'exact' })
      .order(sort==='name' ? 'full_name' : 'created_at', { ascending: sort==='name' })
      .range(from, to);

    if (search) {
      query = query.or(
        `full_name.ilike.%${search}%,role.ilike.%${search}%,skills.ilike.%${search}%,country_name.ilike.%${search}%,bio.ilike.%${search}%`
      );
    }

    const { data, count, error } = await query;
    totalCount = count || 0;
    const grid = document.getElementById('talentGrid');

    if (error) {
      grid.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><h3>Could not load profiles</h3><p>${error.message}</p></div>`;
      document.getElementById('resultsCount').textContent = '0 profiles';
      return;
    }
    if (!data || data.length===0) {
      grid.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><h3>No profiles found</h3><p>Try a different search term.</p></div>`;
      document.getElementById('resultsCount').textContent = '0 profiles';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    grid.innerHTML = data.map((t,i) => buildCard(t,i)).join('');
    document.getElementById('resultsCount').textContent =
      `${totalCount} talent profile${totalCount!==1?'s':''} found`;

    const totalPages = Math.ceil(totalCount/PAGE_SIZE);
    const pag = document.getElementById('pagination');
    if (totalPages>1) {
      pag.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage===1;
      document.getElementById('nextBtn').disabled = currentPage===totalPages;
    } else {
      pag.style.display = 'none';
    }
  }

  function buildCard(t, i) {
    const isDark    = i % 2 === 0;
    const cardClass = isDark ? 'card-dark' : 'card-light';
    const initials  = t.full_name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const yrs       = EXP_YRS[t.experience] || '—';
    const skills    = skillCount(t.skills);
    const bio       = (t.bio || '').slice(0, 80) + ((t.bio||'').length > 80 ? '…' : '');

    const photoHtml = t.headshot_url
      ? `<img src="${escHtml(t.headshot_url)}" alt="${escHtml(t.full_name)}"
             onerror="this.parentElement.innerHTML='<div class=\'card-photo-initials\'>${initials}</div>'">`
      : `<div class="card-photo-initials">${initials}</div>`;

    // star rating — placeholder 4.5–5.0 based on index, replace with real field if you add one
    const rating = (4.5 + (i % 3) * 0.1).toFixed(1);

    return `
      <div class="talent-card ${cardClass}" style="animation-delay:${i*0.06}s" onclick="viewProfile('${t.id}')">
        <div class="card-photo">${photoHtml}</div>
        <div class="card-info">
          <div class="card-nameline">
            <div class="card-name">${escHtml(t.full_name)}</div>
            <span class="card-verified" title="Verified profile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#1d80e8" stroke="none">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </span>
          </div>
          <div class="card-role">${escHtml(t.role || 'AI Professional')}</div>
          <div class="card-loc">${countryFlag(t.country_code)}${escHtml(t.country_name||'')}</div>
          ${bio ? `<div class="card-bio">${escHtml(bio)}</div>` : ''}
        </div>
        <div class="card-stats">
          <span class="stat-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
            ${yrs}
          </span>
          ${skills ? `<span class="stat-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
            ${skills} skills
          </span>` : ''}
          <span class="stat-pill star-pill">
            <span class="star-icon">★</span> ${rating}
          </span>
        </div>
        <button class="card-btn" onclick="event.stopPropagation();viewProfile('${t.id}')">
          View Profile +
        </button>
      </div>`;
  }

  async function viewProfile(id) {
    const { data, error } = await window.supabaseClient
      .from('talent_profiles').select('*').eq('id', id).single();

    if (error || !data) { alert('Could not load profile.'); return; }

    const initials  = data.full_name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const expLabel  = EXP_LABELS[data.experience] || data.experience || '';
    const joinedDate = data.created_at
      ? new Date(data.created_at).toLocaleDateString('en-GB', { month:'long', year:'numeric' }) : null;

    const avatarHtml = data.headshot_url
      ? `<img src="${escHtml(data.headshot_url)}" alt="${escHtml(data.full_name)}">`
      : initials;

    let projectHtml = '';
    if (data.project_url) {
      projectHtml = `<div class="modal-field">
        <div class="modal-field-label">Project / Research</div>
        <div class="modal-field-value">
          <a href="${escHtml(data.project_url)}" target="_blank" style="color:var(--blue);word-break:break-all;">
            🔗 ${escHtml(data.project_url)}
          </a>
        </div>
      </div>`;
    } else if (data.project_description) {
      projectHtml = `<div class="modal-field">
        <div class="modal-field-label">Project / Research</div>
        <div class="modal-field-value">${escHtml(data.project_description)}</div>
      </div>`;
    }

    document.getElementById('profileModal').innerHTML = `
      <div class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-header">
            <button class="modal-close-x" onclick="document.getElementById('profileModal').innerHTML=''">✕</button>
            <div class="modal-avatar-wrap">${avatarHtml}</div>
            <div class="modal-name">${escHtml(data.full_name)}</div>
            <div class="modal-role-text">${escHtml(data.role||'AI Professional')}</div>
            <div class="modal-badges">
              <span class="modal-badge">${countryFlag(data.country_code)}${escHtml(data.country_name||data.country_code||'')}</span>
              ${expLabel ? `<span class="modal-badge">${expLabel}</span>` : ''}
              ${joinedDate ? `<span class="modal-badge">Joined ${joinedDate}</span>` : ''}
            </div>
          </div>
          <div class="modal-body">
            <div class="modal-grid">
              <div class="modal-field">
                <div class="modal-field-label">Email</div>
                <div class="modal-field-value" style="color:var(--blue);">${escHtml(data.email||'—')}</div>
              </div>
              <div class="modal-field">
                <div class="modal-field-label">Country</div>
                <div class="modal-field-value">${countryFlag(data.country_code)}${escHtml(data.country_name||data.country_code||'—')}</div>
              </div>
            </div>
            ${data.education_level ? `
            <div class="modal-grid">
              <div class="modal-field">
                <div class="modal-field-label">Education</div>
                <div class="modal-field-value">${escHtml(data.education_level.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()))}</div>
              </div>
              ${data.institution ? `
              <div class="modal-field">
                <div class="modal-field-label">Institution</div>
                <div class="modal-field-value">${escHtml(data.institution)}</div>
              </div>` : ''}
            </div>` : ''}
            ${data.skills ? `
            <div class="modal-field">
              <div class="modal-field-label">Skills</div>
              <div class="modal-skills">
                ${data.skills.split(',').map(s=>`<span class="modal-skill-tag">${escHtml(s.trim())}</span>`).join('')}
              </div>
            </div>` : ''}
            ${data.bio ? `
            <div class="modal-field">
              <div class="modal-field-label">About</div>
              <div class="modal-field-value">${escHtml(data.bio)}</div>
            </div>` : ''}
            ${data.work_experience ? `
            <div class="modal-field">
              <div class="modal-field-label">Work Experience</div>
              <div class="modal-field-value">${escHtml(data.work_experience)}</div>
            </div>` : ''}
            ${projectHtml}
          </div>
          <div class="modal-footer">
            <button class="modal-close-btn" onclick="document.getElementById('profileModal').innerHTML=''">Close</button>
            <button class="modal-contact-btn" onclick="window.location.href='mailto:${escHtml(data.email)}'">Contact Talent →</button>
          </div>
        </div>
      </div>`;
  }

  function closeModal(e) {
    if (e.target===e.currentTarget) document.getElementById('profileModal').innerHTML='';
  }

  function applySearch() { currentPage=1; loadTalent(); }

  function changePage(dir) {
    const totalPages = Math.ceil(totalCount/PAGE_SIZE);
    currentPage = Math.max(1, Math.min(totalPages, currentPage+dir));
    loadTalent();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('searchInput').addEventListener('keyup', e => {
      if (e.key==='Enter') applySearch();
    });
    loadTalent();
  });
</script>
</body>
</html>
