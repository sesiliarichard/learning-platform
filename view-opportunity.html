<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opportunities – Women in AI Talent Hub</title>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    /* ===== VARIABLES — original unchanged ===== */
    :root {
      --blue:       #0077cc;
      --blue-mid:   #0099ff;
      --blue-light: #00bbff;
      --blue-bg:    #e8f4ff;
      --blue-soft:  #f0f6ff;
      --navy:       #0a1a4a;
      --green:      #22C55E;
      --yellow:     #EAB308;
      --red:        #EF4444;
      --text:       #1a1a2e;
      --muted:      #6B7280;
      --border:     #e0e4f0;
      --white:      #FFFFFF;
      --page-bg:    #f4f6fb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ===== NAV — unchanged ===== */
    nav {
      background: rgba(255,255,255,0.97);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .logo { display:flex; align-items:center; height:44px; text-decoration:none; }
    .logo img { height:100%; object-fit:contain; }
    .nav-back {
      background: white;
      color: var(--blue-mid);
      border: 2px solid var(--blue-mid);
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: all 0.2s;
      font-family: 'Syne', sans-serif;
    }
    .nav-back:hover { background: var(--blue-mid); color: white; }

    /* ===== PAGE HEADER — unchanged ===== */
    .page-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
      padding: 48px 40px 40px;
      position: relative;
      overflow: hidden;
    }
    .page-header::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 300px; height: 300px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }
    .page-header::after {
      content: '';
      position: absolute;
      bottom: -40px; left: 200px;
      width: 180px; height: 180px;
      background: rgba(0,187,255,0.08);
      border-radius: 50%;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .header-text h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: white;
      margin-bottom: 6px;
    }
    .header-text p { color: rgba(255,255,255,0.72); font-size: 14px; }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    .search-wrap { position: relative; }
    .search-wrap input {
      padding: 10px 16px 10px 40px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      color: white;
      outline: none;
      width: 260px;
      transition: all 0.2s;
    }
    .search-wrap input::placeholder { color: rgba(255,255,255,0.6); }
    .search-wrap input:focus {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.5);
    }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      stroke: rgba(255,255,255,0.7);
      fill: none; stroke-width: 2;
    }
    .filter-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 10px;
      padding: 10px 16px;
      color: white; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }
    .filter-btn:hover { background: rgba(255,255,255,0.22); }
    .filter-btn svg { width:14px; height:14px; stroke:white; fill:none; stroke-width:2; }

    /* ===== MAIN CONTENT ===== */
    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ===== FILTER PILLS ROW — unchanged ===== */
    .filters-row {
      display: none;
      gap: 10px; flex-wrap: wrap;
      margin-bottom: 20px; align-items: center;
    }
    .filter-label {
      font-size: 12px; font-weight: 700; color: var(--muted);
      font-family: 'Syne', sans-serif;
      text-transform: uppercase; letter-spacing: .05em; margin-right: 4px;
    }
    .filter-select {
      border: 1.5px solid var(--border);
      border-radius: 8px; padding: 7px 12px;
      font-size: 12px; font-family: inherit;
      background: white; cursor: pointer; outline: none;
      color: var(--text); transition: border-color 0.2s;
    }
    .filter-select:focus { border-color: var(--blue-mid); }
    .clear-filters {
      font-size: 12px; font-weight: 700; color: var(--blue-mid);
      background: none; border: none; cursor: pointer;
      padding: 7px 12px; border-radius: 8px; transition: background 0.15s;
    }
    .clear-filters:hover { background: var(--blue-bg); }

    /* ===== RESULTS BAR ===== */
    .results-bar {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 20px;
    }
    .results-count { font-size: 13px; font-weight: 600; color: var(--text); }
    .sort-select {
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 7px 12px; font-size: 12px; font-family: inherit;
      background: white; cursor: pointer; outline: none;
    }

    /* ===== CARD GRID ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    /* ===== PASTEL CARD COLOURS (matching image 1) ===== */
    /* rotate: peach → mint → lavender → pink → sky → yellow */
    .card-pastel-0 { background: #fde8d8; }  /* peach */
    .card-pastel-1 { background: #d6f0e8; }  /* mint  */
    .card-pastel-2 { background: #e4dff7; }  /* lavender */
    .card-pastel-3 { background: #fce4ef; }  /* pink */
    .card-pastel-4 { background: #d6ecfa; }  /* sky  */
    .card-pastel-5 { background: #fef3c7; }  /* yellow */

    /* ===== JOB CARD ===== */
    .job-card {
      border-radius: 20px;
      border: none;
      padding: 20px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      animation: cardIn 0.35s ease both;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
    }
    .job-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.10);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card top row: date + bookmark icon */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
    }
    .card-bookmark {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(255,255,255,0.55);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .card-bookmark:hover { background: rgba(255,255,255,0.9); }
    .card-bookmark svg { width:14px; height:14px; stroke:#555; fill:none; stroke-width:2; }

    /* Company name (small, above title) */
    .card-company-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    /* Job title + logo row */
    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .card-job-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
      flex: 1;
    }
    .card-logo {
      width: 40px; height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 800; color: white;
      overflow: hidden;
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.7);
    }
    .card-logo img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .logo-blue  { background: linear-gradient(135deg, #0099ff, #0077cc); }
    .logo-navy  { background: linear-gradient(135deg, #0a1a4a, #0077cc); }
    .logo-cyan  { background: linear-gradient(135deg, #00bbff, #0099ff); }
    .logo-teal  { background: linear-gradient(135deg, #0099aa, #007788); }

    /* Pills */
    .card-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .pill {
      display: inline-flex; align-items: center;
      border-radius: 99px;
      font-size: 11px; font-weight: 500;
      padding: 4px 11px;
      background: rgba(255,255,255,0.55);
      color: var(--text);
      border: none;
    }

    /* Card bottom: salary left, Details button right */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-country {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    /* Dark "Details" button — matching image 1 */
    .btn-details {
      padding: 10px 20px;
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 99px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
      white-space: nowrap;
    }
    .btn-details:hover { background: #0a1a4a; }

    /* Apply button (secondary, in modal only) */
    .btn-apply-card {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--blue-mid), var(--blue));
      color: white; border: none; border-radius: 99px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.18s;
      white-space: nowrap;
    }
    .btn-apply-card:hover { transform: translateY(-1px); }

    /* ===== SKELETON CARDS ===== */
    .skel-card {
      border-radius: 20px;
      padding: 20px;
      background: #ece9f5;
      animation: cardIn 0.3s ease both;
    }
    .skel {
      border-radius: 6px;
      background: rgba(0,0,0,0.08);
      animation: shimmer 1.4s infinite;
    }
    .skel-logo-c {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    @keyframes shimmer {
      0%,100% { opacity: 0.5; }
      50%      { opacity: 1;   }
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center; padding: 80px 20px; color: var(--muted);
      grid-column: 1 / -1;
    }
    .empty-state .emoji { font-size: 3rem; margin-bottom: 14px; }
    .empty-state h3 {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700;
      color: var(--text); margin-bottom: 6px;
    }
    .empty-state p { font-size: 13px; }

    /* ===== PAGINATION — unchanged ===== */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; margin-top: 32px;
    }
    .page-btn {
      width: 34px; height: 34px;
      border: 1.5px solid var(--border);
      border-radius: 8px; background: white;
      font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .page-btn:hover { border-color: var(--blue-mid); color: var(--blue); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .page-btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; }
    .page-info { font-size: 13px; font-weight: 600; color: #374151; }

    /* ===== MODAL — unchanged from original ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000; display: flex;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal {
      background: white; border-radius: 20px;
      max-width: 560px; width: 100%; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn {
      from { opacity:0; transform:scale(0.96); }
      to   { opacity:1; transform:scale(1); }
    }
    .modal-header {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      border-radius: 20px 20px 0 0; padding: 28px;
    }
    .modal-logo-row {
      display: flex; align-items: center; gap: 16px; margin-bottom: 12px;
    }
    .modal-logo {
      width: 56px; height: 56px; border-radius: 14px;
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
      color: white; overflow: hidden; flex-shrink: 0;
    }
    .modal-logo img { width:100%; height:100%; object-fit:cover; border-radius:12px; }
    .modal-company-name {
      font-family: 'Syne', sans-serif; font-size: 1.3rem;
      font-weight: 800; color: white;
    }
    .modal-subtitle { color: rgba(255,255,255,0.75); font-size: 13px; margin-top: 3px; }
    .modal-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .modal-chip {
      background: rgba(255,255,255,0.15); color: white;
      border-radius: 6px; font-size: 11px; font-weight: 600; padding: 4px 10px;
    }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .detail-field { background: var(--blue-soft); border-radius: 10px; padding: 12px 16px; }
    .detail-label {
      font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 700;
      color: var(--blue-mid); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 5px;
    }
    .detail-value { font-size: 13px; color: var(--text); line-height: 1.65; white-space: pre-wrap; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-btn-row { display: flex; gap: 10px; margin-top: 4px; }
    .modal-apply-btn {
      flex: 1; padding: 12px;
      background: linear-gradient(135deg, var(--blue-mid), var(--blue));
      color: white; border: none; border-radius: 10px;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(0,153,255,0.3);
    }
    .modal-apply-btn:hover { transform: translateY(-1px); }
    .modal-close-btn {
      padding: 12px 20px; background: white; color: var(--muted);
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .modal-close-btn:hover { border-color: var(--blue-mid); color: var(--blue); }

    /* ===== UTILITY ===== */
    .sr-only {
      position: absolute; width:1px; height:1px; padding:0;
      margin:-1px; overflow:hidden; clip:rect(0,0,0,0);
      white-space:nowrap; border:0;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .header-controls { width: 100%; flex-direction: column; }
      .search-wrap input { width: 100%; }
      .header-inner { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 640px) {
      nav { padding: 0 16px; }
      .page-header { padding: 32px 20px 28px; }
      .page-header h1 { font-size: 1.6rem; }
      .content { padding: 20px 14px 48px; }
      .cards-grid { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .modal-btn-row { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="logo" href="career-support.html">
    <img src="images/logo-non.png" alt="Women in AI Talent Hub"/>
  </a>
  <a href="career-support.html" class="nav-back">← Back to Home</a>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="header-inner">
    <div class="header-text">
      <h1>Opportunity Board</h1>
      <p>Jobs posted by companies seeking AI talent across Africa</p>
    </div>
    <div class="header-controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search roles, companies, skills..."/>
      </div>
      <button class="filter-btn" onclick="toggleFilters()">
        <svg viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        Filters
      </button>
    </div>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- FILTER PILLS -->
  <div class="filters-row" id="filtersRow">
    <span class="filter-label">Filter by:</span>
    <select class="filter-select" id="filterType" onchange="applyFilters()">
      <option value="">All Job Types</option>
      <option value="full-time">Full-time</option>
      <option value="part-time">Part-time</option>
      <option value="contract">Contract</option>
      <option value="internship">Internship</option>
    </select>
    <select class="filter-select" id="filterLocation" onchange="applyFilters()">
      <option value="">All Locations</option>
      <option value="remote">Remote</option>
      <option value="hybrid">Hybrid</option>
      <option value="onsite">On-site</option>
    </select>
    <select class="filter-select" id="filterIndustry" onchange="applyFilters()">
      <option value="">All Industries</option>
      <option value="Technology">Technology</option>
      <option value="Finance">Finance</option>
      <option value="Healthcare">Healthcare</option>
      <option value="Education">Education</option>
      <option value="Government">Government</option>
      <option value="Other">Other</option>
    </select>
    <button class="clear-filters" onclick="clearFilters()">Clear all</button>
  </div>

  <!-- RESULTS BAR -->
  <div class="results-bar">
    <span class="results-count" id="resultsCount">Loading…</span>
    <label for="sortSelect" class="sr-only">Sort opportunities</label>
    <select class="sort-select" id="sortSelect" onchange="applyFilters()">
      <option value="recent">Most Recent</option>
      <option value="company">Company A–Z</option>
    </select>
  </div>

  <!-- CARD GRID -->
  <div class="cards-grid" id="tableBody"></div>

  <!-- PAGINATION -->
  <div class="pagination" id="pagination" style="display:none;">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="pageInfo" class="page-info"></span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>

<!-- JOB DETAIL MODAL -->
<div id="jobModal"></div>

<script>
  let currentPage = 1;
  const PAGE_SIZE = 10;
  let totalCount  = 0;
  const jobCache  = {};

  /* Pastel backgrounds — rotate through 6 colours matching image 1 */
  const PASTEL_CLASSES = [
    'card-pastel-0', /* peach    */
    'card-pastel-1', /* mint     */
    'card-pastel-2', /* lavender */
    'card-pastel-3', /* pink     */
    'card-pastel-4', /* sky      */
    'card-pastel-5', /* yellow   */
  ];
  function pastelClass(i) { return PASTEL_CLASSES[i % PASTEL_CLASSES.length]; }

  const LOGO_CLASSES = ['logo-blue','logo-navy','logo-cyan','logo-teal'];
  function logoClass(i) { return LOGO_CLASSES[i % LOGO_CLASSES.length]; }

  const TYPE_BADGES = {
    'full-time':  { label: 'Full-time'  },
    'part-time':  { label: 'Part-time'  },
    'contract':   { label: 'Contract'   },
    'internship': { label: 'Internship' },
  };
  const LOC_LABELS = { remote:'Remote', hybrid:'Hybrid', onsite:'On-site' };

  function escHtml(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7)  return `${days}d ago`;
    if (days < 30) return `${Math.floor(days/7)}w ago`;
    return `${Math.floor(days/30)}mo ago`;
  }

  /* ── Skeleton cards ── */
  function showSkeletons() {
    document.getElementById('tableBody').innerHTML = Array(6).fill('').map((_,i) => `
      <div class="skel-card ${PASTEL_CLASSES[i % 6]}">
        <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
          <div class="skel" style="width:55px;height:12px;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">
          <div style="flex:1;display:flex;flex-direction:column;gap:7px;">
            <div class="skel" style="width:50%;height:11px;"></div>
            <div class="skel" style="width:75%;height:20px;"></div>
          </div>
          <div class="skel-logo-c"></div>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:24px;">
          <div class="skel" style="width:64px;height:22px;border-radius:99px;"></div>
          <div class="skel" style="width:56px;height:22px;border-radius:99px;"></div>
          <div class="skel" style="width:50px;height:22px;border-radius:99px;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="skel" style="width:80px;height:13px;"></div>
          <div class="skel" style="width:80px;height:36px;border-radius:99px;"></div>
        </div>
      </div>`).join('');
  }

  /* ── Load jobs — logic 100% unchanged ── */
  async function loadJobs() {
    showSkeletons();
    document.getElementById('resultsCount').textContent = 'Loading…';

    const search   = document.getElementById('searchInput').value.trim();
    const type     = document.getElementById('filterType').value;
    const location = document.getElementById('filterLocation').value;
    const industry = document.getElementById('filterIndustry').value;
    const sort     = document.getElementById('sortSelect').value;
    const from     = (currentPage - 1) * PAGE_SIZE;
    const to       = from + PAGE_SIZE - 1;

    let query = window.supabaseClient
      .from('hire_requests')
      .select('*', { count: 'exact' })
      .order(sort === 'company' ? 'company_name' : 'created_at', { ascending: sort === 'company' })
      .range(from, to);

    if (search)   query = query.or(`company_name.ilike.%${search}%,talent_needs.ilike.%${search}%`);
    if (type)     query = query.eq('job_type', type);
    if (location) query = query.eq('location_type', location);
    if (industry) query = query.ilike('industry', `%${industry}%`);

    const { data, count, error } = await query;
    totalCount = count || 0;

    const body = document.getElementById('tableBody');

    if (error) {
      body.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><h3>Could not load jobs</h3><p>${error.message}</p></div>`;
      document.getElementById('resultsCount').textContent = '0 jobs';
      return;
    }
    if (!data || data.length === 0) {
      body.innerHTML = `<div class="empty-state"><div class="emoji">💼</div><h3>No opportunities found</h3><p>Try adjusting your filters or search term.</p></div>`;
      document.getElementById('resultsCount').textContent = '0 jobs found';
      document.getElementById('pagination').style.display = 'none';
      return;
    }

    data.forEach(j => { jobCache[j.id] = j; });
    body.innerHTML = data.map((j, i) => buildRow(j, i)).join('');

    document.getElementById('resultsCount').textContent =
      `${totalCount} opportunit${totalCount !== 1 ? 'ies' : 'y'} found`;

    const totalPages = Math.ceil(totalCount / PAGE_SIZE);
    const pag = document.getElementById('pagination');
    if (totalPages > 1) {
      pag.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage === totalPages;
    } else {
      pag.style.display = 'none';
    }
  }

  /* ── Build card matching image 1 exactly ── */
  function buildRow(j, i) {
    const title    = (j.talent_needs || 'Open Position').split('\n')[0].slice(0, 50);
    const initials = (j.company_name || '?').slice(0, 2).toUpperCase();
    const typeLabel = (TYPE_BADGES[j.job_type] || { label: j.job_type || 'Full-time' }).label;
    const locLabel  = LOC_LABELS[j.location_type] || j.location_type || '';

    const logoHtml = j.logo_url
      ? `<img src="${escHtml(j.logo_url)}" alt="${escHtml(j.company_name)}"
             onerror="this.onerror=null;this.parentElement.textContent='${initials}';this.parentElement.classList.add('${logoClass(i)}')">`
      : initials;

    return `
      <div class="job-card ${pastelClass(i)}" style="animation-delay:${i*0.05}s" onclick="openJob('${j.id}')">

        <div class="card-top">
          <span class="card-date">${timeAgo(j.created_at)}</span>
          <button class="card-bookmark" onclick="event.stopPropagation()" aria-label="Save">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
        </div>

        <div class="card-company-name">${escHtml(j.company_name)}</div>

        <div class="card-title-row">
          <div class="card-job-title">${escHtml(title)}</div>
          <div class="card-logo ${j.logo_url ? '' : logoClass(i)}"
               style="${j.logo_url ? 'background:white;' : ''}">
            ${logoHtml}
          </div>
        </div>

        <div class="card-pills">
          ${typeLabel  ? `<span class="pill">${escHtml(typeLabel)}</span>` : ''}
          ${locLabel   ? `<span class="pill">${escHtml(locLabel)}</span>`  : ''}
          ${j.industry ? `<span class="pill">${escHtml(j.industry)}</span>` : ''}
        </div>

        <div class="card-bottom">
          <div class="card-meta">
            ${j.country ? `<span class="card-country">📍 ${escHtml(j.country)}</span>` : ''}
          </div>
          <button class="btn-details" onclick="event.stopPropagation();openJob('${j.id}')">Details</button>
        </div>

      </div>`;
  }

  /* ── Modal — logic + HTML unchanged ── */
  function openJob(id) {
    const j = jobCache[id];
    if (!j) return;

    const title     = (j.talent_needs || 'Open Position').split('\n')[0];
    const body      = (j.talent_needs || '').split('\n').slice(1).join('\n').trim();
    const initials  = (j.company_name || '?').slice(0, 2).toUpperCase();
    const typeLabel = (TYPE_BADGES[j.job_type] || { label: j.job_type || 'Full-time' }).label;
    const locLabel  = LOC_LABELS[j.location_type] || j.location_type || '—';

    const logoHtml = j.logo_url
      ? `<img src="${escHtml(j.logo_url)}" alt="${escHtml(j.company_name)}">`
      : initials;

    document.getElementById('jobModal').innerHTML = `
      <div class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-header">
            <div class="modal-logo-row">
              <div class="modal-logo">${logoHtml}</div>
              <div>
                <div class="modal-company-name">${escHtml(j.company_name)}</div>
                <div class="modal-subtitle">${escHtml(title)}</div>
              </div>
            </div>
            <div class="modal-chips">
              <span class="modal-chip">${escHtml(typeLabel)}</span>
              <span class="modal-chip">${escHtml(locLabel)}</span>
              ${j.country  ? `<span class="modal-chip">📍 ${escHtml(j.country)}</span>`  : ''}
              ${j.industry ? `<span class="modal-chip">${escHtml(j.industry)}</span>`     : ''}
            </div>
          </div>
          <div class="modal-body">
            <div class="detail-grid">
              <div class="detail-field">
                <div class="detail-label">Contact Email</div>
                <div class="detail-value">${escHtml(j.email || '—')}</div>
              </div>
              <div class="detail-field">
                <div class="detail-label">Posted</div>
                <div class="detail-value">${timeAgo(j.created_at)} · Ref: ${escHtml(j.ref_number || '')}</div>
              </div>
            </div>
            ${body ? `
            <div class="detail-field">
              <div class="detail-label">Job Description</div>
              <div class="detail-value">${escHtml(body)}</div>
            </div>` : ''}
            <div class="modal-btn-row">
              <button class="modal-close-btn" onclick="document.getElementById('jobModal').innerHTML=''">Close</button>
              <button class="modal-apply-btn" onclick="applyJob('${j.id}')">Apply Now →</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function closeModal(e) {
    if (e.target === e.currentTarget) document.getElementById('jobModal').innerHTML = '';
  }

  function applyJob(id) {
    const j = jobCache[id];
    if (!j) return;
    if (j.application_link && j.application_link.trim()) {
      window.open(j.application_link, '_blank', 'noopener');
    } else if (j.email) {
      window.location.href = `mailto:${j.email}?subject=Job Application – Women in AI Talent Hub`;
    } else {
      alert('No application link or contact email available for this position.');
    }
  }

  function applyFilters() { currentPage = 1; loadJobs(); }

  function clearFilters() {
    document.getElementById('searchInput').value    = '';
    document.getElementById('filterType').value     = '';
    document.getElementById('filterLocation').value = '';
    document.getElementById('filterIndustry').value = '';
    applyFilters();
  }

  function changePage(dir) {
    const totalPages = Math.ceil(totalCount / PAGE_SIZE);
    currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
    loadJobs();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleFilters() {
    const row = document.getElementById('filtersRow');
    row.style.display = row.style.display === 'none' ? 'flex' : 'none';
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('searchInput').addEventListener('keyup', e => {
      if (e.key === 'Enter') applyFilters();
    });
    loadJobs();
  });
</script>
</body>
